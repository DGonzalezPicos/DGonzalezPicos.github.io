<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found — Darío González Picos</title>
  <link rel="icon" href="images/jupiter_logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/site.css">
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('theme');
        document.documentElement.setAttribute('data-theme', (saved === 'dark' || saved === 'light') ? saved : 'light');
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
</head>
<body>
  <main class="section">
    <div class="wrap">
      <h1>Page not found</h1>
      <p class="lead">That URL is not part of the current site.</p>
      <p><a class="btn btn-primary" href="./">Back to home</a></p>
    </div>
  </main>
</body>
</html>
